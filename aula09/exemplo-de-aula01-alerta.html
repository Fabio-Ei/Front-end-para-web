<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript no head e no body</title>
</head>

<style>
    .destaque {
        color: blue;
        font-size: 24px;
        font-weight: bold;
    }

</style>

<script>
    alert("O JavaScript do cabeçalho foi executado!");

</script>

<body>

    <h1>JavaScript incorporados</h1>

    <p>Este conteúdo foi escrito diretamente no HTML!</p>
    
    <script>
        document.write('<p class="destaque">Este coteúto foi escrito pelo JavaScript</p>;')
    </script>
</body>
</html>
