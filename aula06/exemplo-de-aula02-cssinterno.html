<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Classes e CSS interno</title>
    <style>
        .título {
            color: darkblue;
            text-align: center;
        }

        .caixa01 {
            background-color: azure;
            border: 2px solid black;
            padding: 20px;
            margin: 20px;
        }

        .caixa02 {
            background-color: rgb(180, 255, 203);
            border: 2px solid rgb(0, 43, 51);
            padding: 20px;
            margin: 20px;
        }

        .destaque02 {
            color: darkgreen;
            background-color: aliceblue;
            font-style: italic;
            padding: 10px;
        }
    </style>
</head>
<body>

    <h1 class="título">Aprendendo classes em CSS</h1>
    <div class="caixa01">
        <p>
            Estou aprendendo a utilizar classes para personalizar os elementos de uma página.
        </p>
        <br>
        <p class="destaque01">
            Este parágrafo utiliza a classe destaque01.
        </p>
        <br>
        <p class="destaque01">
            Este parágrafo utiliza a classe destaque02.
        </p>
    </div>

    <div class="caixa02">
        <p>Este parágrafo não utiliza nenhuma classe.</p>
    </div>
    
</body>
</html>
