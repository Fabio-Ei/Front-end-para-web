<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Tabelas</title>
</head>
<body>

    <h1>Tabelas em HTML</h1>
    <p>
        As tabelas em HTML são usadas para<br>
        organizar dados em linhas de colunas.
    </p>

    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Diego</td>
                <td>42</td>
                <td>São Paulo</td>
            </tr>
            <tr>
                <td>Ana</td>
                <td>36</td>
                <td>Guarulhos</td>
            </tr>
            <tr>
                <td>Bruno</td>
                <td>23</td>
                <td>São Paulo</td>
            </tr>
            <tr>
                <td>Maria</td>
                <td>34</td>
                <td>São Paulo</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
