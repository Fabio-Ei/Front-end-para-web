<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de link</title>
</head>
<body>

    <h1>Exemplo de link e imagem</h1>
    <br>
    <h2>Link externo</h2>
    <p>Acesse o site por meio do link:</p>

        href="https://google.com"
        target="_blank"
        rel="noopener noreferrer"
    >
        Visitar o site da Google
    </a>

    <h2>Imagem do projeto</h2>
    <br>
    <img src="img/paisagem.jpg" alt="Imagem de paisagem" width="300">
    
    
</body>
</html>
